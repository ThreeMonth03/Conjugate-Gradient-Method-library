[build-system]
requires = ["scikit-build-core==0.11.6", "pybind11==3.0.1", "cmake==3.31.10", "ninja==1.13.0"]
build-backend = "scikit_build_core.build"

[project]
name = "cgpy"
version = "0.4.0"
description = "Conjugate gradient solvers with native CPU and optional CUDA implementations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
cuda = ["nvidia-cuda-runtime-cu12==12.8.90; sys_platform == 'linux'", "nvidia-cublas-cu12==12.8.4.1; sys_platform == 'linux'"]

[project.urls]
Documentation = "https://ThreeMonth03.github.io/Conjugate-Gradient-Method-library/"
Repository = "https://github.com/ThreeMonth03/Conjugate-Gradient-Method-library"

[tool.scikit-build]
cmake.version = ">=3.24"
build-dir = "build/wheel/{wheel_tag}"
wheel.packages = ["python/cgpy", "python/cgbench"]
install.components = ["python"]
# An explicit source-file allowlist excludes untracked research files, virtual
# environments, caches and local provider/build artifacts from every sdist.
sdist.exclude = ["**"]
sdist.include = [
    "/CMakeLists.txt", "/CMakePresets.json", "/Makefile", "/pyproject.toml",
    "/README.md", "/.python-version", "/.editorconfig",
    "/.gitignore", "/.clang-format", "/.clang-tidy", "/LICENSE*",
    "/cmake/*.cmake", "/cpp/cg/**/*.hpp", "/cpp/cg/**/*.cpp", "/cpp/cg/**/*.cu", "/cpp/cg/**/*.cuh",
    "/python/cgpy/**/*.py", "/python/cgbench/**/*.py", "/python/README.md",
    "/python/cgpy/**/*.pyi", "/python/cgpy/py.typed", "/tests/typing/*.py",
    "/tests/python/**/*.py", "/tests/cpp/**/*.cpp", "/tests/cpp/**/*.hpp", "/scripts/*.py", "/examples/*.py",
    "/requirements/*.lock", "/requirements/README.md", "/docs/**/*.rst", "/docs/conf.py",
    "/docs/_static/*.css",
]

[tool.scikit-build.cmake.define]
BUILD_TESTING = "OFF"
CG_BUILD_PYTHON = "ON"
CG_ENABLE_OPENMP = "OFF"
CG_ENABLE_BLAS = "OFF"
CG_ENABLE_CUDA = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 79
extend-exclude = [
    ".deps", ".cache", "build", "contrib",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
