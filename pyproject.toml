[build-system]
requires = ["scikit-build-core==0.11.6", "pybind11==3.0.1", "cmake==3.31.10", "ninja==1.13.0"]
build-backend = "scikit_build_core.build"

[project]
name = "cgpy"
version = "0.4.0"
description = "Conjugate gradient solvers with native CPU and optional CUDA implementations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
legacy = ["autograd>=1.8"]
cuda = ["nvidia-cuda-runtime-cu12==12.8.90; sys_platform == 'linux'", "nvidia-cublas-cu12==12.8.4.1; sys_platform == 'linux'"]

[tool.scikit-build]
cmake.version = ">=3.24"
build-dir = "build/wheel/{wheel_tag}"
wheel.packages = ["python/cgpy", "python/cgbench"]
# An explicit source-file allowlist excludes untracked research files, virtual
# environments, caches and local provider/build artifacts from every sdist.
sdist.exclude = ["**"]
sdist.include = [
    "/CMakeLists.txt", "/CMakePresets.json", "/Makefile", "/pyproject.toml",
    "/README.md", "/.gitignore", "/.clang-format", "/.clang-tidy", "/LICENSE*",
    "/cmake/*.cmake", "/include/cg/*.hpp", "/include/cg/detail/*.hpp",
    "/src/*.cpp", "/src/*.cu", "/bindings/*.cpp", "/cpp/*/*.cpp", "/cpp/*/*.hpp",
    "/python/cgpy/**/*.py", "/python/cgbench/**/*.py", "/python/utils.py", "/python/README.md",
    "/tests/*.py", "/tests/cpp/*.cpp", "/scripts/*.py", "/demo/*.py",
    "/requirements/*.lock", "/docs/*.rst", "/docs/*.md", "/docs/conf.py",
    "/docs/_static/*.css", "/benchmarks/README.md",
]

[tool.scikit-build.cmake.define]
BUILD_TESTING = "OFF"
CG_BUILD_PYTHON = "ON"
CG_ENABLE_OPENMP = "OFF"
CG_ENABLE_BLAS = "OFF"
CG_ENABLE_CUDA = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    ".deps", ".cache", "build", "contrib",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
