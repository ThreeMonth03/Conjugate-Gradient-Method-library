[build-system]
requires = ["scikit-build-core==0.11.6", "pybind11==3.0.1"]
build-backend = "scikit_build_core.build"

[project]
name = "cgpy"
version = "0.2.0"
description = "CPU conjugate gradient solvers with a native C++ implementation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "autograd>=1.8"]

[tool.scikit-build]
cmake.version = ">=3.24"
build-dir = "build/wheel/{wheel_tag}"
wheel.packages = ["python/cgpy"]

[tool.scikit-build.cmake.define]
BUILD_TESTING = "OFF"
CG_BUILD_PYTHON = "ON"
CG_ENABLE_OPENMP = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    ".deps", ".cache", "build", "demo", "contrib",
    "python/utils.py", "tests/test_matrix.py", "tests/test_cg_method.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
