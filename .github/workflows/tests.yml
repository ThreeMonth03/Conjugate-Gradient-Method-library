name: Solver checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cuda_gpu_tests:
        description: Run CUDA tests on an explicitly configured self-hosted GPU runner
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cpu-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  style:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project-local tooling
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --cache-dir .cache/pip -r requirements/dev.lock
      - name: Check formatting and Python lint
        run: make lint
      - name: Check native static analysis when the runner provides clang-tidy
        run: |
          if command -v clang-tidy >/dev/null 2>&1; then
            make build PRESET=cpu-debug BUILD_DIR="$PWD/build/cpu-tidy" CMAKE_ARGS='-DCG_ENABLE_CLANG_TIDY=ON -DCG_BUILD_PYTHON=OFF -DBUILD_TESTING=OFF'
          fi

  correctness:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [cpu-release, cpu-openmp, cpu-blas]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project-local tooling
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --cache-dir .cache/pip -r requirements/test.lock
      - name: Run native and Python tests
        run: make test PRESET=${{ matrix.preset }} JOBS=2

      - name: Install project-local Sphinx tooling
        if: matrix.preset != 'cpu-openmp'
        run: .venv/bin/python -m pip install --cache-dir .cache/pip -r requirements/docs.lock
      - name: Build API documentation and execute examples with warnings as errors
        if: matrix.preset != 'cpu-openmp'
        run: make docs doctest PRESET=${{ matrix.preset }} JOBS=2

      - name: Reproduce sparse CG, PCG and direct-solver smoke comparisons
        run: make pyprof PRESET=${{ matrix.preset }} PYPROF_SUITE=smoke-sparse-solvers PYPROF_ROUNDS=6 PYPROF_REPETITIONS=1 JOBS=2
      - name: Install optional CPU benchmark candidates locally
        if: matrix.preset == 'cpu-blas'
        run: .venv/bin/python -m pip install --cache-dir .cache/pip -r requirements/benchmark.lock
      - name: Exercise explicit native and BLAS dense benchmark adapters
        if: matrix.preset == 'cpu-blas'
        run: |
          make pyprof PRESET=cpu-blas PYPROF_SUITE=smoke PYPROF_ROUNDS=8 PYPROF_REPETITIONS=1 JOBS=2 PYPROF_ARGS='--implementations native,native-blas,numpy-out,torch-eager-out'
          .venv/bin/python - <<'PY'
          import json
          import pathlib
          artifact = json.loads(pathlib.Path('build/cpu-blas/benchmarks/smoke-t1-prepared.json').read_text())
          for case in artifact['cases']:
              assert len(case['results']) == 4
              assert all(result['status'] == 'measured' for result in case['results'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sparse-smoke-py312-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/benchmarks/*.json

  sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project-local tooling
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --cache-dir .cache/pip -r requirements/dev.lock
      - name: Run native address and undefined-behavior sanitizers
        run: make gtest PRESET=cpu-asan JOBS=2

  wheel:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        blas: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project-local tooling
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --cache-dir .cache/pip -r requirements/packaging.lock
      - name: Build source distribution and isolated wheel, then test relocated installation
        run: make test-dist DIST_BLAS=${{ matrix.blas }} JOBS=2

  cuda-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project-local build tools and public CUDA runtime wheels
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --cache-dir .cache/pip -r requirements/test.lock -r requirements/cuda.lock
      - name: Install the pinned compiler toolkit inside the project
        run: .venv/bin/python scripts/setup_cuda.py --prefix .deps/cuda-12.8
      - name: Compile CUDA and run tests with explicit no-device skips
        run: make test PRESET=cuda-release JOBS=2
      - name: Build CUDA API documentation and execute available examples
        run: |
          .venv/bin/python -m pip install --cache-dir .cache/pip -r requirements/docs.lock
          make docs doctest PRESET=cuda-release JOBS=2
      - name: Verify a relocated CUDA wheel with only its declared runtime packages
        run: make test-dist DIST_CUDA=ON DIST_DIR=dist/cuda JOBS=2

  cuda-gpu:
    if: github.event_name == 'workflow_dispatch' && inputs.cuda_gpu_tests
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project-local tools and CUDA comparison dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --cache-dir .cache/pip -r requirements/test.lock -r requirements/cuda-benchmark.lock
          .venv/bin/python scripts/setup_cuda.py --prefix .deps/cuda-12.8
      - name: Build and require a real CUDA device
        run: |
          make build PRESET=cuda-release JOBS=2
          PYTHONPATH="$PWD/build/cuda-release/python" .venv/bin/python - <<'PY'
          from cgpy import cuda
          assert cuda.enabled() and cuda.is_available(), 'This job requires a real CUDA device'
          print(cuda.build_info())
          print(cuda.runtime_info())
          PY
      - name: Execute native and Python CUDA tests
        env:
          CG_REQUIRE_CUDA: '1'
        run: make test PRESET=cuda-release JOBS=2
      - name: Exercise explicit resident CUDA benchmark modes
        run: |
          make pyprof PRESET=cuda-release PYPROF_SUITE=smoke-cuda-dense PYPROF_ROUNDS=6 PYPROF_REPETITIONS=1 JOBS=2 PYPROF_ARGS='--device cuda --cuda-device 0 --implementations cuda-native,cuda-cublas,torch-cuda-eager'
          .venv/bin/python - <<'PY'
          import json
          import pathlib
          artifact = json.loads(pathlib.Path('build/cuda-release/benchmarks/smoke-cuda-dense-t1-prepared.json').read_text())
          for case in artifact['cases']:
              assert len(case['results']) == 3
              assert all(result['status'] == 'measured' for result in case['results'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cuda-gpu-smoke
          path: build/cuda-release/benchmarks/*.json
