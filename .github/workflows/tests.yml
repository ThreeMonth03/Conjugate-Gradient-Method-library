name: CPU checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  style:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project-local tooling
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --cache-dir .cache/pip -r requirements/dev.lock
      - name: Check formatting and Python lint
        run: make lint
      - name: Check native static analysis when the runner provides clang-tidy
        run: |
          if command -v clang-tidy >/dev/null 2>&1; then
            make build PRESET=cpu-debug BUILD_DIR="$PWD/build/cpu-tidy" CMAKE_ARGS='-DCG_ENABLE_CLANG_TIDY=ON -DCG_BUILD_PYTHON=OFF -DBUILD_TESTING=OFF'
          fi

  correctness:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            preset: cpu-release
          - python: '3.12'
            preset: cpu-release
          - python: '3.12'
            preset: cpu-openmp
          - python: '3.10'
            preset: cpu-blas
          - python: '3.12'
            preset: cpu-blas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install project-local tooling
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --cache-dir .cache/pip -r requirements/test.lock
      - name: Run native and Python tests
        run: make test PRESET=${{ matrix.preset }} JOBS=2

      - name: Install project-local Sphinx tooling
        if: matrix.python == '3.12' && matrix.preset != 'cpu-openmp'
        run: .venv/bin/python -m pip install --cache-dir .cache/pip -r requirements/docs.lock
      - name: Build API documentation and execute examples with warnings as errors
        if: matrix.python == '3.12' && matrix.preset != 'cpu-openmp'
        run: make docs doctest PRESET=${{ matrix.preset }} JOBS=2

      - name: Reproduce sparse CG, PCG and direct-solver smoke comparisons
        run: make pyprof PRESET=${{ matrix.preset }} PYPROF_SUITE=smoke-sparse-solvers PYPROF_ROUNDS=6 PYPROF_REPETITIONS=1 JOBS=2
      - name: Install optional CPU benchmark candidates locally
        if: matrix.python == '3.12' && matrix.preset == 'cpu-blas'
        run: .venv/bin/python -m pip install --cache-dir .cache/pip -r requirements/benchmark.lock
      - name: Exercise explicit native and BLAS dense benchmark adapters
        if: matrix.python == '3.12' && matrix.preset == 'cpu-blas'
        run: |
          make pyprof PRESET=cpu-blas PYPROF_SUITE=smoke PYPROF_ROUNDS=8 PYPROF_REPETITIONS=1 JOBS=2 PYPROF_ARGS='--implementations native,native-blas,numpy-out,torch-eager-out'
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          artifact = json.loads(Path('build/cpu-blas/benchmarks/smoke-t1-prepared.json').read_text())
          for case in artifact['cases']:
              assert len(case['results']) == 4
              assert all(result['status'] == 'measured' for result in case['results'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sparse-smoke-py${{ matrix.python }}-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/benchmarks/*.json

  sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project-local tooling
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --cache-dir .cache/pip -r requirements/dev.lock
      - name: Run native address and undefined-behavior sanitizers
        run: make gtest PRESET=cpu-asan JOBS=2

  wheel:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
        blas: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install project-local tooling
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --cache-dir .cache/pip -r requirements/packaging.lock
      - name: Build source distribution and isolated wheel, then test relocated installation
        run: make test-dist DIST_BLAS=${{ matrix.blas }} JOBS=2
