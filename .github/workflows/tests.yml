name: Solver checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cuda_gpu_tests:
        description: Run CUDA tests on an explicitly configured self-hosted GPU runner
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cpu-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  style:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install project-local tooling
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --cache-dir .cache/pip -r requirements/dev.lock
      - name: Check formatting and Python lint
        run: make lint
      - name: Install the native static analyzer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-tidy-18
      - name: Check native static analysis
        run: make build PRESET=cpu-debug BUILD_DIR="$PWD/build/cpu-tidy" CMAKE_ARGS='-DCG_ENABLE_CLANG_TIDY=ON -DCG_CLANG_TIDY=clang-tidy-18 -DCG_BUILD_PYTHON=OFF -DBUILD_TESTING=OFF'

  correctness:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [cpu-release, cpu-openmp, cpu-blas]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install project-local tooling
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --cache-dir .cache/pip -r requirements/test.lock
      - name: Install optional CPU benchmark candidates locally
        if: matrix.preset == 'cpu-blas'
        run: .venv/bin/python -m pip install --cache-dir .cache/pip -r requirements/benchmark.lock
      - name: Run native and Python tests
        run: make test PRESET=${{ matrix.preset }} JOBS=2

      - name: Build without Python and verify relocated C++ consumers
        run: make test-native PRESET=${{ matrix.preset }} JOBS=2

      - name: Check public Python types without a CUDA extension
        if: matrix.preset == 'cpu-release'
        run: make typecheck JOBS=2

      - name: Install project-local Sphinx tooling
        if: matrix.preset == 'cpu-blas'
        run: .venv/bin/python -m pip install --cache-dir .cache/pip -r requirements/docs.lock
      - name: Build API documentation and execute examples with warnings as errors
        if: matrix.preset == 'cpu-blas'
        run: make docs doctest PRESET=${{ matrix.preset }} JOBS=2

      - name: Reproduce sparse CG, PCG and direct-solver smoke comparisons
        run: make pyprof PRESET=${{ matrix.preset }} PYPROF_SUITE=smoke-sparse-solvers PYPROF_ROUNDS=6 PYPROF_REPETITIONS=1 JOBS=2
      - name: Exercise explicit native and BLAS dense benchmark adapters
        if: matrix.preset == 'cpu-blas'
        run: |
          make pyprof PRESET=cpu-blas PYPROF_SUITE=smoke PYPROF_ROUNDS=8 PYPROF_REPETITIONS=1 JOBS=2 PYPROF_ARGS='--implementations native,native-blas,numpy-out,torch-eager-out'
          .venv/bin/python - <<'PY'
          import json
          import pathlib
          artifact = json.loads(pathlib.Path('build/cpu-blas/benchmarks/smoke-t1-prepared.json').read_text())
          for case in artifact['cases']:
              assert len(case['results']) == 4
              assert all(result['status'] == 'measured' for result in case['results'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sparse-smoke-py312-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/benchmarks/*.json

  sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install project-local tooling
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --cache-dir .cache/pip -r requirements/dev.lock
      - name: Run native address and undefined-behavior sanitizers
        run: make gtest PRESET=cpu-asan JOBS=2

  wheel:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        blas: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install project-local tooling
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --cache-dir .cache/pip -r requirements/packaging.lock
      - name: Build source distribution and isolated wheel, then test relocated installation
        run: make test-dist DIST_BLAS=${{ matrix.blas }} JOBS=2

  cuda-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install project-local build tools and public CUDA runtime wheels
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --cache-dir .cache/pip -r requirements/test.lock -r requirements/cuda.lock
      - name: Install the pinned compiler toolkit inside the project
        run: .venv/bin/python scripts/setup_cuda.py --prefix .deps/cuda-12.8
      - name: Compile CUDA and run tests with explicit no-device skips
        run: make test PRESET=cuda-release JOBS=2
      - name: Verify relocated CPU and CUDA C++ consumers without Python
        run: make test-native PRESET=cuda-release JOBS=2
      - name: Build CUDA API documentation and execute available examples
        run: |
          .venv/bin/python -m pip install --cache-dir .cache/pip -r requirements/docs.lock
          make docs doctest PRESET=cuda-release JOBS=2
      - name: Verify a relocated CUDA wheel with only its declared runtime packages
        run: make test-dist DIST_CUDA=ON DIST_DIR=dist/cuda JOBS=2

  cuda-gpu:
    if: github.event_name == 'workflow_dispatch' && inputs.cuda_gpu_tests
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install project-local tools and CUDA comparison dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --cache-dir .cache/pip -r requirements/test.lock -r requirements/cuda-benchmark.lock
          .venv/bin/python scripts/setup_cuda.py --prefix .deps/cuda-12.8
      - name: Build and require a real CUDA device
        run: |
          make build PRESET=cuda-release JOBS=2
          PYTHONPATH="$PWD/build/cuda-release/python" .venv/bin/python - <<'PY'
          from cgpy import cuda
          assert cuda.enabled() and cuda.is_available(), 'This job requires a real CUDA device'
          print(cuda.build_info())
          print(cuda.runtime_info())
          PY
      - name: Execute native and Python CUDA tests
        env:
          CG_REQUIRE_CUDA: '1'
        run: make test PRESET=cuda-release JOBS=2
      - name: Require real CUDA solves through a relocated C++ installation
        run: make test-native PRESET=cuda-release NATIVE_ARGS=--require-cuda JOBS=2
      - name: Exercise explicit resident CUDA benchmark modes
        run: |
          make pyprof PRESET=cuda-release PYPROF_SUITE=smoke-cuda-dense PYPROF_ROUNDS=6 PYPROF_REPETITIONS=1 JOBS=2 PYPROF_ARGS='--device cuda --cuda-device 0 --implementations cuda-native,cuda-cublas,torch-cuda-eager'
          .venv/bin/python - <<'PY'
          import json
          import pathlib
          artifact = json.loads(pathlib.Path('build/cuda-release/benchmarks/smoke-cuda-dense-t1-prepared.json').read_text())
          for case in artifact['cases']:
              assert len(case['results']) == 3
              assert all(result['status'] == 'measured' for result in case['results'])
          PY
      - name: Verify public CUDA Jacobi scopes and execution modes
        env:
          CUBLAS_WORKSPACE_CONFIG: ':4096:8'
        run: |
          for scope in api session prepared; do
            for mode in host device; do
              make pyprof PRESET=cuda-release JOBS=2 \
                PYPROF_SUITE=smoke-cuda-dense PYPROF_THREADS=1 \
                PYPROF_SCOPE="$scope" PYPROF_ROUNDS=6 PYPROF_REPETITIONS=1 \
                PYPROF_OUTPUT="build/cuda-release/benchmarks/smoke-cuda-dense-jacobi-${scope}-${mode}.json" \
                PYPROF_ARGS="--device cuda --cuda-device 0 --implementations cuda-native,cuda-cublas,torch-cuda-eager --cuda-execution-mode ${mode} --preconditioner jacobi --warmups 3"
            done
          done
          PYTHONPATH="$PWD/build/cuda-release/python" .venv/bin/python - <<'PY'
          from pathlib import Path
          from cgbench.artifacts import load_artifact

          names = {'cuda-native', 'cuda-cublas', 'torch-cuda-eager'}
          hashes = set()
          paths = []
          for scope in ('api', 'session', 'prepared'):
              for mode in ('host', 'device'):
                  path = Path('build/cuda-release/benchmarks') / f'smoke-cuda-dense-jacobi-{scope}-{mode}.json'
                  paths.append(path)
                  artifact = load_artifact(path)
                  spec = artifact['spec']
                  assert spec['suite'] == 'smoke-cuda-dense'
                  assert spec['device'] == 'cuda' and spec['cuda_device'] == 0
                  assert spec['scope'] == scope and spec['threads'] == 1
                  assert set(spec['implementations']) == names
                  assert spec['solver']['preconditioner'] == 'jacobi'
                  assert spec['solver']['algorithm'] == 'standard'
                  assert spec['solver']['fused'] is True
                  assert spec['solver'].get('execution_mode', 'host') == mode
                  assert ('execution_mode' in spec['solver']) == (mode == 'device')
                  assert len(artifact['cases']) == 1
                  case = artifact['cases'][0]
                  hashes.add(case['input_sha256'])
                  assert case['sampling'] == {'warmups': 3, 'rounds': 6, 'repetitions': 1}
                  assert case['cycle_rows'] == 6
                  assert len(case['results']) == 3
                  assert {result['name'] for result in case['results']} == names
                  for result in case['results']:
                      assert result['status'] == 'measured'
                      setup = result['setup']
                      assert setup['cuda_device'] == 0
                      assert setup['preconditioner'] == 'jacobi'
                      assert setup['setup_in_timed_call'] is (scope != 'prepared')
                      if result['name'] == 'torch-cuda-eager':
                          assert setup['native_execution_mode'] == mode
                          assert setup['native_execution_mode_applies'] is False
                      else:
                          assert setup['execution_mode'] == mode
                          assert setup['dense_kernel'] == ('cublas' if result['name'] == 'cuda-cublas' else 'native')
                          assert setup['fused'] is True and setup['stream'] == 0
                      if scope == 'session':
                          for key, expected in {
                              'workspace_reused': True,
                              'workspace_in_timed_call': False,
                              'output_reused': False,
                              'output_in_timed_call': True,
                              'preconditioner_reused': False,
                              'preconditioner_in_timed_call': True,
                          }.items():
                              assert setup[key] is expected
          assert len(paths) == len(set(paths)) == 6
          assert len(hashes) == 1, 'Scope/mode smokes must use the same fixture bytes'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cuda-gpu-smoke
          path: build/cuda-release/benchmarks/*.json
